name: Ruff Linter

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  ruff:
    name: Run Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: Run Ruff formatter
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."
