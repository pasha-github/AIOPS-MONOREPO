[tool.ruff]
# Same as Black.
line-length = 88
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.

[tool.ruff.lint]
# Select rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # simplfication
    "PTH", # path
    "T20", # No print
    "RUF", # ruff rules
    # TODO: Add S for security
    # TODO: Add N for pep8-naming
]

ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function call in argument defaults (common in FastAPI)
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["routers", "database", "utils", "connectors", "main"]

[tool.pyright]
ignore = ["migrations", "tests"]
pythonVersion = "3.12"           # your python version
pythonPlatform = "Linux"
extraPaths = ["connectors"]
typeCheckingMode = "basic"       # "basic" | "standard" | "strict"

# TODO: Will be changed to standard
