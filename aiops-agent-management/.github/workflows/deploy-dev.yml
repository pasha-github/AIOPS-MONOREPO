name: Build & Deploy to Cloud Run (Dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch: # Allow manual triggers from GitHub UI

env:
  PROJECT_ID: rc-ai-ops-internal
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: aiops-registry
  SERVICE_NAME: agent-manager-dev
  IMAGE: agent-manager-dev

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation (recommended)

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Authenticate to Google Cloud ───────────────────────────────────
      # Option A (recommended): Workload Identity Federation — no long-lived keys
      # Requires one-time setup: https://github.com/google-github-actions/auth#setup
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.WIF_PROVIDER }}   # e.g. projects/123/locations/global/workloadIdentityPools/my-pool/providers/my-provider
      #     service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}       # e.g. my-sa@rc-ai-ops-internal.iam.gserviceaccount.com

      # Option B: Service Account JSON key (simpler but less secure)
      # Uncomment below and comment out Option A if you prefer key-based auth.
      - name: Authenticate to Google Cloud (SA Key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ── 3. Set up gcloud CLI ──────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── 4. Configure Docker for Artifact Registry ─────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # ── 5. Build Docker image ─────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest \
            .

      # ── 6. Push to Artifact Registry ──────────────────────────────────────
      - name: Push image to Artifact Registry
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

      # ── 7. Set up Python (for Alembic) ─────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 8. Install uv ───────────────────────────────────────────────────────
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # ── 9. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: uv pip install --system --no-cache -r requirements.txt

      # ── 10. Run database migrations against the target database ────────────
      # Runs only after the new image has been built and pushed, so a failed
      # migration means the (already-pushed) image simply never gets deployed.
      - name: Run database migrations
        env:
          MAIN_SERVER_DATABASE_URL: ${{ secrets.MAIN_SERVER_DATABASE_URL_DEV }}
        run: alembic upgrade head

      # ── 11. Deploy to Cloud Run ──────────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --port=8000 \
            --min-instances=0 \
            --max-instances=50 \
            --set-env-vars="\
              MAIN_SERVER_DATABASE_URL=${{ secrets.MAIN_SERVER_DATABASE_URL_DEV }},\
              AGENT_SERVER_DATABASE_URL=${{ secrets.AGENT_SERVER_DATABASE_URL_DEV }},\
              ENV=${{ secrets.ENV }},\
              A2A=${{ secrets.A2A }},\
              POSTGRES_AGENT_SERVER_DATABASE_URL=${{ secrets.POSTGRES_AGENT_SERVER_DATABASE_URL }},\
              ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}, \
              SOP_EMBEDDING_MODEL=${{ secrets.SOP_EMBEDDING_MODEL }},\
              SOP_EMBEDDING_DIM=${{ secrets.SOP_EMBEDDING_DIM }},\
              OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},\
              INGEST_ON_STARTUP=${{ secrets.INGEST_ON_STARTUP }},\
              SHP_ID_APP=${{ secrets.SHP_ID_APP }},\
              SHP_ID_APP_SECRET=${{ secrets.SHP_ID_APP_SECRET }},\
              SHP_TENANT_ID=${{ secrets.SHP_TENANT_ID }},\
              SHP_SITE_URL=${{ secrets.SHP_SITE_URL }},\
              SHP_DOC_LIBRARY=${{ secrets.SHP_DOC_LIBRARY }},\
              CF_DOMAIN=${{ secrets.CF_DOMAIN }},\
              CF_EMAIL=${{ secrets.CF_EMAIL }},\
              CF_API_TOKEN=${{ secrets.CF_API_TOKEN }},\
              CF_SPACE_KEY=${{ secrets.CF_SPACE_KEY }},\
              OD_ID_APP=${{ secrets.OD_ID_APP }},\
              OD_ID_APP_SECRET=${{ secrets.OD_ID_APP_SECRET }},\
              OD_TENANT_ID=${{ secrets.OD_TENANT_ID }},\
              OD_TENANT=${{ secrets.OD_TENANT }},\
              OD_USER_EMAIL=${{ secrets.OD_USER_EMAIL }},\
              OD_FOLDER=${{ secrets.OD_FOLDER }}" \
            --quiet

      # ── 12. Route all traffic to the new revision ───────────────────────────
      - name: Update traffic to latest revision
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-latest \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      # ── 13. Print the deployed service URL ──────────────────────────────────
      - name: Get Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "✅ Deployed to: $URL"
