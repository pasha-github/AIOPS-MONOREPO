name: Quality

on:
  push:
    paths:
      - "src/**"
      - "migrations/**"
      - "alembic.ini"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src migrations

      - name: Compile
        run: python -m compileall src migrations
