# Reusable checks for the listener service: formatting, vet, tests, lint, and an
# IBM MQ (cgo, `-tags ibmmq`) compile/vet. Called by ci-listener-service.yml on
# pull requests and by deploy-listener-service.yml as a pre-deploy gate.

name: Listener Service Checks

on:
  workflow_call:

env:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: v2.1.6
  # IBM MQ redistributable client (matches the Dockerfile default).
  MQ_URL: https://public.dhe.ibm.com/ibmdl/export/pub/software/websphere/messaging/mqdev/redist/9.4.1.0-IBM-MQC-Redist-LinuxX64.tar.gz

jobs:
  quality:
    name: Format, vet, test & lint (Kafka build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listener-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: listener-service/go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: golangci-lint
        # Run the pinned version via `go run` so CI matches local runs exactly
        # (default/Kafka build tags; ibmmq.go is covered by the ibmmq-build job).
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }} run ./...

  ibmmq-build:
    name: Compile & vet IBM MQ build (cgo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: listener-service
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: listener-service/go.sum

      - name: Install IBM MQ redistributable client
        run: |
          sudo mkdir -p /opt/mqm
          curl -fsSL "$MQ_URL" -o /tmp/mqclient.tar.gz
          sudo tar -zxf /tmp/mqclient.tar.gz -C /opt/mqm
          rm -f /tmp/mqclient.tar.gz

      - name: Build (-tags ibmmq)
        run: go build -tags ibmmq ./...

      - name: Vet (-tags ibmmq)
        run: go vet -tags ibmmq ./...
