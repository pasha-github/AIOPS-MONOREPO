spring:
  application:
    name: mcp-server
    
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
      
    instance:
    leaseRenewalIntervalInSeconds: 10   # send heartbeat every 10 seconds
    leaseExpirationDurationInSeconds: 30 # expire instance if no heartbeat in 30 seconds

  datasource:
    url: jdbc:mysql://localhost:3306/mcp_tools
    username: root
    password: Cyber@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
