services:

  # The playwright-mcp image runs as uid 1000 (node) but fresh named volumes
  # are root-owned — without this chown every browser_navigate/download fails
  # with EACCES writing to --output-dir.
  downloads-init:
    image: busybox
    command: chown -R 1000:1000 /downloads
    volumes:
      - downloads:/downloads
    restart: "no"

  playwright-mcp:
    image: mcr.microsoft.com/playwright/mcp:latest
    depends_on:
      downloads-init:
        condition: service_completed_successfully
    command:
      - "--headless"
      - "--browser=chromium"
      - "--host=0.0.0.0"
      - "--port=8931"
      - "--output-dir=/downloads"
      - "--allowed-hosts=playwright-mcp:8931"
    shm_size: "2gb"   # Chromium needs more than Docker's 64MB /dev/shm default
    volumes:
      - downloads:/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  agent:
    build: ./agent
    env_file: .env
    environment:
      MCP_URL: http://playwright-mcp:8931/mcp
      DATABASE_URL: postgresql://docflow:docflow@postgres:5432/docflow
      DOWNLOADS_DIR: /downloads
    ports:
      - "8090:8080"
    volumes:
      - downloads:/downloads
    depends_on:
      postgres:
        condition: service_healthy
      playwright-mcp:
        condition: service_started
    restart: unless-stopped

volumes:
  downloads:
  pgdata:
