document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

g               */\n  --surface-2:     #F2EEE5;  /* deeper cream — wells, code blocks            */\n  --ink-bg:        #1A1714;  /* dark section background                      */\n  --ink-surface:   #262220;  /* dark card / elevated on dark                 */\n\n  --border:        #E7E2D8;  /* hairline borders, dividers                   */\n  --border-strong: #D6D0C4;  /* stronger borders, input outlines             */\n  --border-on-dark:#3A3531;  /* borders on dark surfaces                     */\n\n  /* ---- Semantic status -------------------------------------------------- */\n  --success:       #1F8A4C;  --success-bg: #E7F4EC;\n  --danger:        #D93838;  --danger-bg:  #FBEBEB;\n  --info:          #2A6DD6;  --info-bg:    #EAF1FC;\n  --warning:       #C7820A;  --warning-bg: #FBF1DC;\n\n  /* ---- Typography: families --------------------------------------------- */\n  --font-display: 'Space Grotesk', system-ui, sans-serif; /* headlines, mark */\n  --font-sans:    'Geist', system-ui, sans-serif;          /* body & UI      */\n  --font-mono:    'Space Mono', ui-monospace, monospace;   /* code, prompts  */\n\n  /* ---- Typography: type scale (px) -------------------------------------- */\n  --fs-display: clamp(48px, 6vw, 76px); /* @kind font */\n  --fs-h1:      clamp(36px, 4.4vw, 52px); /* @kind font */\n  --fs-h2:      clamp(28px, 3vw, 38px); /* @kind font */\n  --fs-h3:      26px;\n  --fs-h4:      21px;\n  --fs-h5:      18px;\n  --fs-body-lg: 18px;\n  --fs-body:    16px;\n  --fs-body-sm: 14px;\n  --fs-caption: 13px;\n  --fs-overline:12px;\n\n  /* ---- Line heights ----------------------------------------------------- */\n  --lh-tight:   1.04; /* @kind font */\n  --lh-snug:    1.18; /* @kind font */\n  --lh-normal:  1.5; /* @kind font */\n  --lh-relaxed: 1.65; /* @kind font */\n\n  /* ---- Spacing scale (4px base) ----------------------------------------- */\n  --sp-1: 4px;   --sp-2: 8px;   --sp-3: 12px;  --sp-4: 16px;\n  --sp-5: 20px;  --sp-6: 24px;  --sp-7: 32px;  --sp-8: 40px;\n  --sp-9: 48px;  --sp-10: 64px; --sp-11: 80px; --sp-12: 96px; --sp-13: 128px;\n\n  /* ---- Radii ------------------------------------------------------------ */\n  --r-xs: 4px;  --r-sm: 8px;  --r-md: 12px;  --r-lg: 16px;  --r-xl: 24px;\n  --r-pill: 999px;\n\n  /* ---- Shadows (warm-tinted, soft) -------------------------------------- */\n  --shadow-sm: 0 1px 2px rgba(26,23,20,.06), 0 1px 1px rgba(26,23,20,.04);\n  --shadow-md: 0 2px 8px rgba(26,23,20,.08), 0 1px 2px rgba(26,23,20,.05);\n  --shadow-lg: 0 12px 32px rgba(26,23,20,.10), 0 4px 8px rgba(26,23,20,.05);\n  --shadow-orange: 0 8px 24px rgba(255,102,0,.28);\n  --ring-orange: 0 0 0 3px rgba(255,102,0,.32);\n\n  /* ---- Motion ----------------------------------------------------------- */\n  --ease-out: cubic-bezier(.22,.61,.36,1); /* @kind other */\n  --ease-in-out: cubic-bezier(.65,.05,.36,1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur: 200ms; /* @kind other */\n  --dur-slow: 360ms; /* @kind other */\n}\n\n/* ============================================================================\n   SEMANTIC ELEMENT STYLES\n   Apply via element selectors or .ap-* utility classes.\n   ============================================================================ */\n\n.ap-display, .ap-prose h1.display {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-display);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.03em;\n  color: var(--ink);\n}\n\nh1, .ap-h1 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-h1);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.025em;\n  color: var(--ink);\n}\n\nh2, .ap-h2 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--fs-h2);\n  line-height: var(--lh-snug);\n  letter-spacing: -0.02em;\n  color: var(--ink);\n}\n\nh3, .ap-h3 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--fs-h3);\n  line-height: var(--lh-snug);\n unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ff04d2e4-f4ff-4dcd-926c-bf27097580b5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ---- Brand: AI Playbook Orange ---------------------------------------- */\n  --orange:        #FF6600;  /* primary brand orange (YC-aligned)            */\n  --orange-hover:  #EA5E00;  /* hover: ~6% darker                            */\n  --orange-press:  #CC5200;  /* active/press                                 */\n  --orange-deep:   #B84A00;  /* text-on-light emphasis, deep accents         */\n  --orange-tint:   #FFF4EC;  /* faint surface wash                           */\n  --orange-tint-2: #FFE5D2;  /* stronger tint (chips, highlights)            */\n  --orange-tint-3: #FFD2B5;  /* border on tinted surfaces                    */\n\n  /* ---- Ink / Neutrals (warm-leaning) ------------------------------------ */\n  --ink:           #1A1714;  /* fg1 — primary text, near-black warm          */\n  --fg-2:          #57514A;  /* secondary text                               */\n  --fg-3:          #8A8178;  /* muted text, placeholders, captions           */\n  --fg-on-dark:    #F7F4EE;  /* primary text on dark surfaces                */\n  --fg-2-on-dark:  #B5AEA4;  /* secondary text on dark surfaces              */\n\n  --bg:            #FFFFFF;  /* base surface                                 */\n  --surface-1:     #FAF7F1;  /* warm cream — sections, page bg               */\n  --surface-2:     #F2EEE5;  /* deeper cream — wells, code blocks            */\n  --ink-bg:        #1A1714;  /* dark section background                      */\n  --ink-surface:   #262220;  /* dark card / elevated on dark                 */\n\n  --border:        #E7E2D8;  /* hairline borders, dividers                   */\n  --border-strong: #D6D0C4;  /* stronger borders, input outlines             */\n  --border-on-dark:#3A3531;  /* borders on dark surfaces                     */\n\n  /* ---- Semantic status -------------------------------------------------- */\n  --success:       #1F8A4C;  --success-bg: #E7F4EC;\n  --danger:        #D93838;  --danger-bg:  #FBEBEB;\n  --info:          #2A6DD6;  --info-bg:    #EAF1FC;\n  --warning:       #C7820A;  --warning-bg: #FBF1DC;\n\n  /* ---- Typography: families --------------------------------------------- */\n  --font-display: 'Space Grotesk', system-ui, sans-serif; /* headlines, mark */\n  --font-sans:    'Geist', system-ui, sans-serif;          /* body & UI      */\n  --font-mono:    'Space Mono', ui-monospace, monospace;   /* code, prompts  */\n\n  /* ---- Typography: type scale (px) -------------------------------------- */\n  --fs-display: clamp(48px, 6vw, 76px); /* @kind font */\n  --fs-h1:      clamp(36px, 4.4vw, 52px); /* @kind font */\n  --fs-h2:      clamp(28px, 3vw, 38px); /* @kind font */\n  --fs-h3:      26px;\n  --fs-h4:      21px;\n  --fs-h5:      18px;\n  --fs-body-lg: 18px;\n  --fs-body:    16px;\n  --fs-body-sm: 14px;\n  --fs-caption: 13px;\n  --fs-overline:12px;\n\n  /* ---- Line heights ----------------------------------------------------- */\n  --lh-tight:   1.04; /* @kind font */\n  --lh-snug:    1.18; /* @kind font */\n  --lh-normal:  1.5; /* @kind font */\n  --lh-relaxed: 1.65; /* @kind font */\n\n  /* ---- Spacing scale (4px base) ----------------------------------------- */\n  --sp-1: 4px;   --sp-2: 8px;   --sp-3: 12px;  --sp-4: 16px;\n  --sp-5: 20px;  --sp-6: 24px;  --sp-7: 32px;  --sp-8: 40px;\n  --sp-9: 48px;  --sp-10: 64px; --sp-11: 80px; --sp-12: 96px; --sp-13: 128px;\n\n  /* ---- Radii ------------------------------------------------------------ */\n  --r-xs: 4px;  --r-sm: 8px;  --r-md: 12px;  --r-lg: 16px;  --r-xl: 24px;\n  --r-pill: 999px;\n\n  /* ---- Shadows (warm-tinted, soft) -------------------------------------- */\n  --shadow-sm: 0 1px 2px rgba(26,23,20,.06), 0 1px 1px rgba(26,23,20,.04);\n  --shadow-md: 0 2px 8px rgba(26,23,20,.08), 0 1px 2px rgba(26,23,20,.05);\n  --shadow-lg: 0 12px 32px rgba(26,23,20,.10), 0 4px 8px rgba(26,23,20,.05);\n  --shadow-orange: 0 8px 24px rgba(255,102,0,.28);\n  --ring-orange: 0 0 0 3px rgba(255,102,0,.32);\n\n  /* ---- Motion ----------------------------------------------------------- */\n  --ease-out: cubic-bezier(.22,.61,.36,1); /* @kind other */\n  --ease-in-out: cubic-bezier(.65,.05,.36,1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur: 200ms; /* @kind other */\n  --dur-slow: 360ms; /* @kind other */\n}\n\n/* ============================================================================\n   SEMANTIC ELEMENT STYLES\n   Apply via element selectors or .ap-* utility classes.\n   ============================================================================ */\n\n.ap-display, .ap-prose h1.display {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-display);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.03em;\n  color: var(--ink);\n}\n\nh1, .ap-h1 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--fs-h1);\n  line-height: var(--lh-tight);\n  letter-spacing: -0.025em;\n  color: var(--ink);\n}\n\nh2, .ap-h2 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--fs-h2);\n  line-height: var(--lh-snug);\n  letter-spacing: -0.02em;\n  color: var(--ink);\n}\n\nh3, .ap-h3 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: var(--fs-h3);\n  line-height: var(--lh-snug);\n  letter-spacing: -0.015em;\n  color: var(--ink);\n}\n\nh4, .ap-h4 {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  font-size: var(--fs-h4);\n  line-height: var(--lh-snug);\n  color: var(--ink);\n}\n\nh5, .ap-h5 {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  font-size: var(--fs-h5);\n  line-height: var(--lh-normal);\n  color: var(--ink);\n}\n\np, .ap-body {\n  font-family: var(--font-sans);\n  font-weight: 400;\n  font-size: var(--fs-body);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-2);\n}\n\n.ap-body-lg {\n  font-family: var(--font-sans);\n  font-weight: 400;\n  font-size: var(--fs-body-lg);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-2);\n}\n\n.ap-body-sm { font-family: var(--font-sans); font-size: var(--fs-body-sm); line-height: var(--lh-normal); color: var(--fg-2); }\n.ap-caption { font-family: var(--font-sans); font-size: var(--fs-caption); line-height: var(--lh-normal); color: var(--fg-3); }\n\n.ap-overline {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  font-size: var(--fs-overline);\n  line-height: 1;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  color: var(--orange-deep);\n}\n\ncode, .ap-code, kbd, pre {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n}\n.ap-code-inline {\n  font-family: var(--font-mono);\n  font-size: 0.9em;\n  background: var(--surface-2);\n  border: 1px solid var(--border);\n  border-radius: var(--r-xs);\n  padding: 0.1em 0.4em;\n  color: var(--orange-deep);\n}\n\na, .ap-link { color: var(--orange-deep); text-decoration: none; }\na:hover, .ap-link:hover { text-decoration: underline; text-underline-offset: 2px; }\n\n<\u002Fstyle>\n<script src=\"78a8d8d2-235c-444d-b3c9-78eadb3dd30f\"><\u002Fscript>\n<script src=\"6215d48d-4ab1-4173-8b21-d307e30b95d6\"><\u002Fscript>\n<script src=\"8167451e-9c32-41d9-8f81-908cac0e42fa\"><\u002Fscript>\n<script src=\"e0d8ac6f-a2b6-46b9-a870-58b562dfd473\"><\u002Fscript>\n<style>\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{font-family:var(--font-sans);color:var(--ink);background:var(--surface-1);-webkit-font-smooth .navitem.on svg{color:var(--orange)}\n.navitem .nc{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--fg-3);background:var(--surface-2);border-radius:var(--r-pill);padding:1px 8px;min-width:24px;text-align:center}\n.navitem.on .nc{color:var(--orange-deep);background:var(--bg)}\n.navitem.alert .nc{color:var(--danger);background:var(--danger-bg)}\n\n.tile{flex:1;min-width:120px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;transition:box-shadow var(--dur),transform var(--dur),border-color var(--dur);text-align:left}\n.tile:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--border-strong)}\n.tile .tn{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--ink);line-height:1}\n.tile .tl{font-size:12px;color:var(--fg-2);margin-top:5px;display:block}\n.tile.alert{background:var(--danger-bg);border-color:#f2c9c9}\n.tile.alert .tn{color:var(--danger)}\n.tile.alert .tl{color:var(--danger)}\n\n.panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}\n\n.tbl-wrap{overflow:auto}\ntable.doc-table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}\n.doc-table thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);color:var(--fg-2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap}\n.doc-table tbody td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--fg-2);line-height:1.45}\n.doc-table tbody tr{transition:background var(--dur)}\n.doc-table tbody tr.click{cursor:pointer}\n.doc-table tbody tr.click:hover{background:var(--orange-tint)}\n.doc-table tbody tr.od td{background:#fdf4f3}\n.doc-table tbody tr.od.click:hover td{background:#fbe9e7}\n.doc-table tbody tr:last-child td{border-bottom:0}\n.mono{font-family:var(--font-mono)}\n.docno{font-family:var(--font-mono);font-weight:700;color:var(--ink);font-size:12px;white-space:nowrap}\n.dtitle{color:var(--ink);font-weight:500;max-width:340px}\n.c-sum{color:var(--fg-3);font-size:11.5px;margin-top:2px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n\n.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-sans);font-weight:600;font-size:11px;letter-spacing:.01em;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;border:1px solid transparent;line-height:1.5}\n.tag::before{content:\"\";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}\n.tag.approved{color:var(--success);background:var(--success-bg);border-color:#bfe3cd}\n.tag.pending{color:var(--warning);background:var(--warning-bg);border-color:#efdcb0}\n.tag.review{color:var(--info);background:var(--info-bg);border-color:#c7dbf7}\n.tag.revise{color:var(--orange-deep);background:var(--orange-tint);border-color:var(--orange-tint-3)}\n.tag.rejected{color:var(--danger);background:var(--danger-bg);border-color:#f2c9c9}\n.tag.closed{color:var(--fg-3);background:var(--surface-2);border-color:var(--border)}\n.od-flag{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-sans);font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--danger);border-radius:var(--r-pill);padding:2px 7px;margin-left:6px;white-space:nowrap}\n\n.iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--border-on-dark);background:rgba(255,255,255,.06);color:var(--fg-on-dark);cursor:pointer;transition:background var(--dur)}\n.iconbtn:hover{background:rgba(255,255,255,.14)}\n.iconbtn svg{width:18px;height:18px}\n.iconbtn .badge-dot{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:var(--r-pill);background:var(--danger);color:#fff;font-family:var(--font-mono);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink-bg)}\n\n.ai-dot{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px var(--success-bg);flex:none}\n.msg{max-width:94%;padding:9px 12px;border-radius:var(--r-md);line-height:1.5;font-size:13px;overflow-wrap:break-word;animation:df-fade var(--dur) var(--ease-out)}\n.msg.user{align-self:flex-end;background:var(--orange);color:#fff;border-bottom-right-radius:4px}\n.msg.ai{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-bottom-left-radius:4px}\n.msg.ai p{margin:0 0 6px}.msg.ai p:last-child{margin:0}\n.msg.ai code{font-family:var(--font-mono);font-size:11.5px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-xs);padding:1px 5px;color:var(--orange-deep)}\n.msg.ai .tbl-wrap{margin:8px 0;border:1px solid var(--border);border-radius:var(--r-sm);max-height:300px;background:var(--bg)}\n.msg.ai .doc-table{font-size:11.5px}\n.msg.ai .doc-table thead th{font-size:9.5px;padding:7px 8px}\n.msg.ai .doc-table tbody td{padding:7px 8px}\n.msg.ai .hint{color:var(--fg-3);font-size:11.5px;margin-top:4px}\n.msg.ai .warn{color:var(--danger);font-weight:600}\n.msg.ai .kv{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;margin:8px 0;font-size:12px}\n.msg.ai .kv span{display:block;color:var(--fg-3);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}\n.msg.ai .sect{font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);margin:12px 0 6px}\n.msg.ai .comment{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:var(--r-xs);padding:8px 10px;margin-bottom:6px}\n.msg.ai .c-head{font-size:11px;color:var(--fg-3);margin-bottom:3px}\n.msg.ai .c-text{font-size:12.5px;color:var(--ink)}\n.msg.ai .attach{font-size:12.5px;padding:3px 0}\n.msg.ai .meta{color:var(--fg-3)}\n.msg.ai .detail-head{margin-bottom:6px}\n.msg.ai .next{margin-top:8px}\n.dl-btn{margin-left:8px;padding:3px 10px;font-size:11px;font-family:var(--font-sans);font-weight:600;border:1px solid var(--orange);color:var(--orange-deep);background:var(--bg);border-radius:var(--r-xs);cursor:pointer}\n.dl-btn:hover{background:var(--orange-tint)}\n.h-demo:hover{border-color:var(--orange) !important;background:var(--orange-tint) !important}\n.h-logout:hover{color:#fff !important}\n.h-surf:hover{background:var(--surface-2) !important}\n.h-tint:hover{background:var(--orange-tint) !important}\n.h-notif:hover{background:var(--surface-1) !important}\n.h-dl:hover{border-color:var(--orange) !important;color:var(--orange-deep) !important}\n\n.dtab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--fg-2);cursor:pointer;white-space:nowrap;transition:color var(--dur)}\n.dtab:hover{color:var(--ink)}\n.dtab.on{color:var(--orange-deep);border-bottom-color:var(--orange);font-weight:600}\n.kvbox{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}\n.kvbox .k{display:block;color:var(--fg-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}\n.kvbox .v{color:var(--ink);font-size:13.5px}\n.dsect{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2);margin:0 0 10px}\n.dcomment{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 13px}\n.step{display:flex;gap:12px}\n.step .rail{display:flex;flex-direction:column;align-items:center}\n.step .dot{width:13px;height:13px;border-radius:50%;background:var(--border-strong);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--border-strong);flex:none;margin-top:2px}\n.step.done .dot{background:var(--success);box- ight:22px\"><path d=\"M4 4h10l6 6v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z\"><\u002Fpath><path d=\"M14 4v6h6\"><\u002Fpath><path d=\"M8 13h8M8 17h5\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.02em;color:#fff\">DocFlow AI<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:420px\">\n      <div style=\"font-family:var(--font-sans);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange)\">Enterprise document control<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.02em;color:#fff;margin:14px 0 16px\">Every drawing, RFI and approval — traceable and audit-ready.<\u002Fh1>\n      <p style=\"font-size:15px;line-height:1.6;color:var(--fg-2-on-dark);margin:0\">A lite DMS for EPC and construction teams: review codes 1–4, revision control, role-based access and a full audit trail on every action.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:22px;color:var(--fg-2-on-dark);font-size:12px\">\n      <span style=\"display:flex;align-items:center;gap:7px\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--orange)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:15px;height:15px\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg> Role-based access<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:7px\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--orange)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:15px;height:15px\"><path d=\"M12 8v4l3 2\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg> Full audit trail<\u002Fspan>\n      <span style=\"display:flex;align-items:center;gap:7px\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--orange)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:15px;height:15px\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> WCAG AA<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;display:flex;align-items:center;justify-content:center;background:var(--surface-1);padding:32px\">\n    <div style=\"width:100%;max-width:400px\">\n      <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink);margin:0 0 4px\">Sign in<\u002Fh2>\n      <p style=\"font-size:13.5px;color:var(--fg-2);margin:0 0 22px\">Access is scoped to your role, project and discipline.<\u002Fp>\n\n      <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"\">\n        <div style=\"display:flex;align-items:center;gap:8px;background:var(--danger-bg);color:var(--danger);border:1px solid #f2c9c9;border-radius:var(--r-sm);padding:9px 11px;font-size:13px;margin-bottom:14px\">\n          <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:16px;height:16px;flex:none\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 8v5M12 16h.01\"><\u002Fpath><\u002Fsvg>\n          <span>{{ loginError }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <label style=\"display:block;font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:6px\">Username or email<\u002Flabel>\n      <input class=\"df-in\" type=\"text\" placeholder=\"e.g. rajesh\" value=\"{{ loginUser }}\" sc-camel-on-input=\"{{ setLoginUser }}\" sc-camel-on-key-down=\"{{ onLoginKey }}\" style=\"margin-bottom:14px\">\n\n      <label style=\"display:block;font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:6px\">Password<\u002Flabel>\n      <input class=\"df-in\" type=\"password\" placeholder=\"demo123\" value=\"{{ loginPass }}\" sc-camel-on-input=\"{{ setLoginPass }}\" sc-camel-on-key-down=\"{{ onLoginKey nt-display);font-weight:700;font-size:16px;color:var(--ink)\">Session audit trail<\u002Fdiv><div style=\"font-size:12px;color:var(--fg-3)\">Every login, view, search and write — user + timestamp. Admin only.<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeAudit }}\" aria-label=\"Close\" style=\"display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--bg);color:var(--fg-2);cursor:pointer\"><svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:17px;height:17px\"><path d=\"M18 6 6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"tbl-wrap\" style=\"flex:1;overflow:auto\">\n          <sc-raw-table class=\"doc-table\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th>Timestamp<\u002Fsc-raw-th><sc-raw-th>User<\u002Fsc-raw-th><sc-raw-th>Action<\u002Fsc-raw-th><sc-raw-th>Detail<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ auditRows }}\" as=\"e\" hint-placeholder-count=\"6\">\n                <sc-raw-tr><sc-raw-td class=\"mono\" style=\"white-space:nowrap\">{{ e.timestamp }}<\u002Fsc-raw-td><sc-raw-td style=\"white-space:nowrap\">{{ e.user }}<\u002Fsc-raw-td><sc-raw-td><span class=\"tag closed\" style=\"font-size:10px\">{{ e.action }}<\u002Fspan><\u002Fsc-raw-td><sc-raw-td style=\"color:var(--ink)\">{{ e.detail }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n          <sc-if value=\"{{ noAudit }}\" hint-placeholder-val=\"\"><div style=\"padding:26px;text-align:center;color:var(--fg-3);font-size:13px\">No audit entries recorded yet this session.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ confirmOpen }}\" hint-placeholder-val=\"\">\n    <div class=\"modal-back\" sc-camel-on-click=\"{{ confirmNo }}\">\n      <div class=\"modal-card\" style=\"max-width:440px\" sc-camel-on-click=\"{{ stop }}\">\n        <div style=\"padding:22px 22px 8px\"><div style=\"font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--ink);margin-bottom:8px\">{{ confirmTitle }}<\u002Fdiv><div style=\"font-size:13.5px;color:var(--fg-2);line-height:1.55\">{{ confirmMsg }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:16px 22px 20px;display:flex;gap:10px;justify-content:flex-end\">\n          <x-import component-from-global-scope=\"AIPlaybookDesignSystem_2f74f7.Button\" variant=\"ghost\" size=\"md\" sc-camel-on-click=\"{{ confirmNo }}\" hint-size=\"auto,40px\">Cancel<\u002Fx-import>\n          <x-import component-from-global-scope=\"AIPlaybookDesignSystem_2f74f7.Button\" variant=\"primary\" size=\"md\" sc-camel-on-click=\"{{ confirmYes }}\" hint-size=\"auto,40px\">{{ confirmCta }}<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'login',\n    loginUser: '', loginPass: '', loginProject: 'SPCL', loginError: '',\n    user: null,\n    view: 'all', disc: '', q: '',\n    drawerOpen: false, drawerDoc: null, drawerPerms: null, activeTab: 'overview', commentDraft: '',\n    bellOpen: false,\n    chatOpen: true, chatInput: '', chatLog: [], chatUnread: false,\n    auditOpen: false,\n    confirm: null,\n    tick: 0,\n  };\n\n  chatLogRef = React.createRef();\n  _lastDoc = null;\n\n  componentDidMount() {\n    const self = this;\n    try {\n      Object.defineProperty(window, 'DFBridge', {\n        configurable: true,\n        value: {\n          refresh: () => self.refresh(),\n          onLogout: () => self.doLogout(),\n          openDetail: (dn) => self.openDetail(dn),\n          get lastOpenedDoc() { return self._lastDoc || self.state.drawerDoc || null; },\n          set lastOpenedDoc(v) { self._lastDoc = v; },\n        },\n      });\n    } catch (e) {}\n    this.forceUpdate();\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (this.chatLogRef.current && this.state.chatLog !== prevState.chatLog) {\n      this.chatLogRef.current.scrollTop = this.chatLogRef.current.scrollHeight;\n    }\n  }\n\n  refresh() {\n    this.setState((s) => {\n      const ns = { tick: s.tick + 1 };\n      if (s.drawerDoc) {\n        const det = DMS.get_document_details(s.drawerDoc.doc_id);\n        if (det.ok) { ns.drawerDoc = det.data; ns.drawerPerms = det.permissions; this._lastDoc = det.data; }\n      }\n      return ns;\n    });\n  }\n\n  pushAI(html) {\n    this.setState((s) => ({ chatLog: [...s.chatLog, { who: 'ai', html }], chatUnread: s.chatOpen ? false : true }));\n  }\n  pushUser(text) {\n    this.setState((s) => ({ chatLog: [...s.chatLog, { who: 'user', html: text }] }));\n  }\n\n  // ---- login ----\n  setLoginUser = (e) => this.setState({ loginUser: e.target.value });\n  setLoginPass = (e) => this.setState({ loginPass: e.target.value });\n  setLoginProject = (e) => this.setState({ loginProject: e.target.value });\n  onLoginKey = (e) => { if (e.key === 'Enter') this.doLogin(); };\n\n  doLogin = () => {\n    const res = DMS.authenticate_user(this.state.loginUser, this.state.loginPass);\n    if (!res.ok) { this.setState({ loginError: res.error, loginPass: '' }); return; }\n    this.enterApp(res.data);\n  };\n\n  enterApp(user) {\n    const g = Chat.greeting(user);\n    this.setState({\n      screen: 'app', user, loginError: '', loginPass: '',\n      chatLog: [{ who: 'ai', html: g.html }], chatOpen: true, chatUnread: false,\n      drawerOpen: false, bellOpen: false, auditOpen: false, view: 'all', disc: '', q: '',\n    });\n  }\n\n  doLogout = () => {\n    DMS.logout();\n    this._lastDoc = null;\n    this.setState({\n      screen: 'login', user: null, loginUser: '', loginPass: '', loginError: '',\n      drawerOpen: false, drawerDoc: null, drawerPerms: null, bellOpen: false, auditOpen: false,\n      chatLog: [], chatInput: '', view: 'all', disc: '', q: '',\n    });\n  };\n\n  // ---- filters / nav ----\n  setQ = (e) => this.setState({ q: e.target.value });\n  setViewAll = () => this.setState({ view: 'all', bellOpen: false });\n  setViewPending = () => this.setState({ view: 'pending', bellOpen: false });\n  setViewOverdue = () => this.setState({ view: 'overdue', bellOpen: false });\n  setViewMine = () => this.setState({ view: 'mine', bellOpen: false });\n  setDiscAll = () => this.setState({ disc: '' });\n\n  // ---- bell / audit ----\n  toggleBell = () => this.setState((s) => ({ bellOpen: !s.bellOpen }));\n  closeBell = () => this.setState({ bellOpen: false });\n  toggleAudit = () => this.setState((s) => ({ auditOpen: !s.auditOpen, bellOpen: false }));\n  closeAudit = () => this.setState({ auditOpen: false });\n  stop = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };\n\n  // ---- chat ----\n  toggleChat = () => this.setState((s) => ({ chatOpen: !s.chatOpen, chatUnread: false }));\n  setChatInput = (e) => this.setState({ chatInput: e.target.value });\n  onChatKey = (e) => { if (e.key === 'Enter') { e.preventDefault(); this.sendChat(); } };\n\n  sendChat = () => {\n    const text = (this.state.chatInput || '').trim();\n    if (!text) return;\n    const loginMatch = text.match(/^login\\s+(\\S+)\\s+(\\S+)/i);\n    if (!DMS.session && loginMatch) {\n      this.pushUser(`login ${loginMatch[1]} ••••••••`);\n      this.setState({ chatInput: '' });\n      const res = DMS.authenticate_user(loginMatch[1], loginMatch[2]);\n      if (res.ok) this.enterApp(res.data);\n      else this.pushAI(`<p>${res.error} Please try again, or use the login panel.<\u002Fp>`);\n      return;\n    }\n    this.pushUser(text);\n    this.setState({ chatInput: '' });\n    const out = Chat.handle(text);\n    this.pushAI(out.html);\n  };\n\n  // ---- drawer ----\n  openDetail = (docNumber) => {\n    const det = DMS.get_document_details(docNumber);\n    if (!det.ok) return;\n    this._lastDoc = det.data;\n    this.setState({ drawerDoc: det.data, drawerPerms: det.permissions, drawerOpen: true, activeTab: 'overview', commentDraft: '', bellOpen: false });\n  };\n  closeDrawer = () => this.setState({ drawerOpen: false, drawerDoc: null, drawerPerms: null });\n  setTabOverview = () => this.setState({ activeTab: 'overview' });\n  setTabComments = () => this.setState({ activeTab: 'comments' });\n  setTabRevisions = () => this.setState({ activeTab: 'revisions' });\n  setTabWorkflow = () => this.setState({ activeTab: 'workflow' });\n  setTabAttachments = () => this.setState({ activeTab: 'attachments' });\n  setCommentDraft = (e) => this.setState({ commentDraft: e.target.value });\n\n  postComment = () => {\n    const d = this.state.drawerDoc;\n    const text = (this.state.commentDraft || '').trim();\n    if (!d || !text) return;\n    const res = DMS.add_comment(d.doc_id, text);\n    if (res.ok) {\n      this.setState({ commentDraft: '' });\n      this.refresh();\n      this.pushAI(`<p>✅ Comment added to <strong>${d.doc_number}<\u002Fstrong> via the detail view. Action logged for audit.<\u002Fp>`);\n    } else {\n      this.pushAI(`<p>${res.error}<\u002Fp>`);\n    }\n  };\n\n  askConfirm(title, msg, cta, onYes) {\n    this.setState({ confirm: { title, msg, cta, onYes } });\n  }\n  confirmYes = () => { const c = this.state.confirm; this.setState({ confirm: null }); if (c && c.onYes) c.onYes(); };\n  confirmNo = () => this.setState({ confirm: null });\n\n  applyCode(code) {\n    const d = this.state.drawerDoc;\n    const label = DMS.REVIEW_CODES[code].label;\n    this.askConfirm('Apply review decision', `Apply ${label} to ${d.doc_number} — “${d.title}”? This is recorded in the workflow trail and audit log.`, label.split(' — ')[0], () => {\n      const res = DMS.update_status(d.doc_id, code);\n      if (res.ok) {\n        this.refresh();\n        this.pushAI(`<p>✅ <strong>${label}<\u002Fstrong> applied to <strong>${d.doc_number}<\u002Fstrong> by ${DMS.session.user.display_name}. Action logged for audit.<\u002Fp>`);\n      } else this.pushAI(`<p>${res.error}<\u002Fp>`);\n    });\n  }\n  uploadRev() {\n    const d = this.state.drawerDoc;\n    const next = /^\\d+$/.test(d.revision) ? String(Number(d.revision) + 1) : String.fromCharCode(d.revision.charCodeAt(0) + 1);\n    this.askConfirm('Upload new revision', `Upload Rev ${next} to ${d.doc_number}? Current Rev ${d.revision} will be superseded (retained in history) and status reset to Pending review.`, 'Upload Rev ' + next, () => {\n      const file = d.doc_number.replace(/-[A-Z0-9]+$/, '') + '-' + next + '.pdf';\n      const res = DMS.upload_revision(d.doc_id, file, next);\n      if (res.ok) {\n        this.refresh();\n        this.pushAI(`<p>✅ Rev <strong>${next}<\u002Fstrong> uploaded to <strong>${res.data.doc_number}<\u002Fstrong>. Status reset to Pending review. Action logged for audit.<\u002Fp>`);\n      } else this.pushAI(`<p>${res.error}<\u002Fp>`);\n    });\n  }\n\n  // ---- attachment download (client-side placeholder generation) ----\n  _pdfEscape(s) { return String(s).replace(/\\\\/g, '\\\\\\\\').replace(/\\(/g, '\\\\(').replace(/\\)/g, '\\\\)').replace(/[^\\x20-\\x7E]/g, '?'); }\n  _makePdf(lines) {\n    const content = 'BT /F1 11 Tf 50 790 Td 15 TL ' + lines.map((l) => `(${this._pdfEscape(l)}) Tj T*`).join(' ') + ' ET';\n    const objs = [\n      '<< /Type /Catalog /Pages 2 0 R >>',\n      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',\n      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>',\n      `<< /Length ${content.length} >>\\nstream\\n${content}\\nendstream`,\n      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',\n    ];\n    let pdf = '%PDF-1.4\\n'; const offsets = [];\n    objs.forEach((o, i) => { offsets.push(pdf.length); pdf += `${i + 1} 0 obj\\n${o}\\nendobj\\n`; });\n    const xref = pdf.length;\n    pdf += `xref\\n0 ${objs.length + 1}\\n0000000000 65535 f \\n` + offsets.map((o) => String(o).padStart(10, '0') + ' 00000 n \\n').join('');\n    pdf += `trailer\\n<< /Size ${objs.length + 1} /Root 1 0 R >>\\nstartxref\\n${xref}\\n%%EOF`;\n    return new Blob([pdf], { type: 'application/pdf' });\n  }\n\n  _canvasJpeg(canvas) {\n    const bin = atob(canvas.toDataURL('image/jpeg', 0.9).split(',')[1]);\n    const bytes = new Uint8Array(bin.length);\n    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);\n    return bytes;\n  }\n  _makeImagePdf(bytes, iw, ih) {\n    const enc = new TextEncoder();\n    const PW = 842, PH = 595; // A4 landscape (pt)\n    const scale = Math.min(PW / iw, PH / ih);\n    const w = iw * scale, h = ih * scale, ox = (PW - w) / 2, oy = (PH - h) / 2;\n    const content = `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${ox.toFixed(2)} ${oy.toFixed(2)} cm /Im0 Do Q`;\n    const chunks = []; let pos = 0; const off = [];\n    const S = (s) => { const b = enc.encode(s); chunks.push(b); pos += b.length; };\n    const B = (b) => { chunks.push(b); pos += b.length; };\n    S('%PDF-1.4\\n');\n    off[0] = pos; S('1 0 obj\\n<< /Type /Catalog /Pages 2 0 R >>\\nendobj\\n');\n    off[1] = pos; S('2 0 obj\\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\\nendobj\\n');\n    off[2] = pos; S(`3 0 obj\\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\\nendobj\\n`);\n    off[3] = pos; S(`4 0 obj\\n<< /Length ${content.length} >>\\nstream\\n${content}\\nendstream\\nendobj\\n`);\n    off[4] = pos; S(`5 0 obj\\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\\nstream\\n`);\n    B(bytes); S('\\nendstream\\nendobj\\n');\n    const xref = pos;\n    let x = 'xref\\n0 6\\n0000000000 65535 f \\n';\n    for (let i = 0; i < 5; i++) x += String(off[i]).padStart(10, '0') + ' 00000 n \\n';\n    S(x); S(`trailer\\n<< /Size 6 /Root 1 0 R >>\\nstartxref\\n${xref}\\n%%EOF`);\n    return new Blob(chunks, { type: 'application/pdf' });\n  }\n  _wrapText(g, text, x, y, maxW, lh, maxLines) {\n    const words = String(text).split(/\\s+/); let line = '', ln = 0;\n    for (let i = 0; i < words.length; i++) {\n      const t = line ? line + ' ' + words[i] : words[i];\n      if (g.measureText(t).width > maxW && line) {\n        g.fillText(line, x, y); y += lh; ln++; line = words[i];\n        if (ln >= maxLines - 1) { let rest = line; while (i + 1 < words.length) { i++; rest += ' ' + words[i]; } if (g.measureText(rest + '…').width > maxW) { while (rest.length && g.measureText(rest + '…').width > maxW) rest = rest.slice(0, -1); rest += '…'; } g.fillText(rest, x, y); return y + lh; }\n      } else line = t;\n    }\n    if (line) { g.fillText(line, x, y); y += lh; }\n    return y;\n  }\n  _cloud(g, cx, cy, rx, ry) {\n    g.beginPath();\n    const bumps = 14, step = (Math.PI * 2) / bumps, r = Math.min(rx, ry) * 0.34;\n    for (let i = 0; i < bumps; i++) {\n      const a = i * step, px = cx + Math.cos(a) * rx, py = cy + Math.sin(a) * ry;\n      g.moveTo(px + r, py); g.arc(px, py, r, 0, Math.PI * 2);\n    }\n    g.stroke();\n  }\n  _makeDrawingCanvas(doc) {\n    const W = 1414, H = 1000, c = document.createElement('canvas'); c.width = W; c.height = H;\n    const g = c.getContext('2d');\n    g.lineJoin = 'round'; g.lineCap = 'round';\n    g.fillStyle = '#fdfdfb'; g.fillRect(0, 0, W, H);\n    g.strokeStyle = '#1A1714'; g.lineWidth = 3; g.strokeRect(16, 16, W - 32, H - 32);\n    g.lineWidth = 1; g.strokeRect(26, 26, W - 52, H - 52);\n    const A = { x: 62, y: 66, w: W - 124, h: H - 66 - 208 };\n\n    // grid + bubbles\n    const cols = 6, rows = 4;\n    g.strokeStyle = '#ded7ca'; g.lineWidth = 1;\n    for (let i = 0; i <= cols; i++) { const x = A.x + (A.w / cols) iting your action${d.due_date ? ' — due ' + d.due_date : ''}.`, icon: '📋', color: 'var(--warning)', onOpen: () => this.openDetail(d.doc_number) });\n    });\n\n    // chat body element\n    const chatBody = React.createElement(\n      'div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } },\n      s.chatLog.map((mm, i) => mm.who === 'user'\n        ? React.createElement('div', { key: i, className: 'msg user' }, mm.html)\n        : React.createElement('div', { key: i, className: 'msg ai', dangerouslySetInnerHTML: { __html: mm.html } })\n      )\n    );\n\n    const u = s.user;\n    const initials = (u.display_name || '?').split(' ').map((x) => x[0]).slice(0, 2).join('').toUpperCase();\n    const isAdmin = u.role === (typeof ROLES !== 'undefined' ? ROLES.ADMIN : 'Admin/Auditor');\n    const crumb = s.drawerOpen && s.drawerDoc\n      ? `Project ${s.drawerDoc.project_id} › ${s.drawerDoc.discipline} › ${s.drawerDoc.doc_number}`\n      : `Project ${u.projects[0]} › ${s.disc || 'All disciplines'}`;\n\n    const base = {\n      isLogin: false, isApp: true,\n      userName: u.display_name, userRole: u.role, userInitials: initials, isAdmin, crumb,\n      doLogout: this.doLogout,\n      setTabOverview: this.setTabOverview, setTabComments: this.setTabComments,\n      setTabRevisions: this.setTabRevisions, setTabWorkflow: this.setTabWorkflow, setTabAttachments: this.setTabAttachments,\n      // nav\n      countAll: all.length, countPending: awaitingN, countOverdue: overdueN, countMine: mineN,\n      viewAllOn: s.view === 'all' ? 'on' : '', viewPendingOn: s.view === 'pending' ? 'on' : '',\n      viewOverdueOn: s.view === 'overdue' ? 'on' : '', viewMineOn: s.view === 'mine' ? 'on' : '',\n      setViewAll: this.setViewAll, setViewPending: this.setViewPending, setViewOverdue: this.setViewOverdue, setViewMine: this.setViewMine,\n      disciplines, discAllOn: s.disc === '' ? 'on' : '', setDiscAll: this.setDiscAll,\n      // header\n      q: s.q, setQ: this.setQ, viewTitle,\n      resultLine: `${rows.length} document${rows.length === 1 ? '' : 's'}${s.q ? ' matching “' + s.q + '”' : ''}`,\n      tileTotal: all.length, tileAwaiting: awaitingN, tileMine: mineN, tileOverdue: overdueN,\n      overdueTileCls: overdueN ? 'alert' : '',\n      rows, hasRows: rows.length > 0, noRows: rows.length === 0,\n      // assistant\n      chatOpen: s.chatOpen, chatClosed: !s.chatOpen, chatUnread: s.chatUnread,\n      toggleChat: this.toggleChat, chatBody, chatInput: s.chatInput, setChatInput: this.setChatInput,\n      onChatKey: this.onChatKey, sendChat: this.sendChat, chatLogRef: this.chatLogRef,\n      // bell\n      bellOpen: s.bellOpen, toggleBell: this.toggleBell, closeBell: this.closeBell,\n      notifs, notifCount: notifs.length, hasNotifs: notifs.length > 0, noNotifs: notifs.length === 0,\n      // audit\n      auditOpen: s.auditOpen, toggleAudit: this.toggleAudit, closeAudit: this.closeAudit, stop: this.stop,\n      // confirm\n      confirmOpen: !!s.confirm, confirmTitle: s.confirm ? s.confirm.title : '', confirmMsg: s.confirm ? s.confirm.msg : '',\n      confirmCta: s.confirm ? s.confirm.cta : 'Confirm', confirmYes: this.confirmYes, confirmNo: this.confirmNo,\n      // drawer defaults\n      drawerOpen: s.drawerOpen, closeDrawer: this.closeDrawer,\n    };\n\n    if (isAdmin && s.auditOpen) {\n      const r = DMS.get_audit_trail();\n      const entries = r.ok ? r.data.slice(-60).reverse() : [];\n      base.auditRows = entries.map((e) => ({ timestamp: e.timestamp, user: DMS.nameOf(e.user), action: e.action, detail: e.detail }));\n      base.noAudit = entries.length === 0;\n    } else { base.auditRows = []; base.noAudit = false; }\n\n    if (s.drawerOpen && s.drawerDoc) {\n      const d = s.drawerDoc; const p = s.drawerPerms || {};\n      const m = this.statusMeta(d);\n      base.dDocNo = d.doc_number; base.dTitle = d.title; base.dStatusClass = m.cls; base.dStatusLabel = m.label; base.dOverdue = DMS.isOverdue(d);\n      base.commentCount = d.comments.length;\n      base.tabOverview = s.activeTab === 'overview'; base.tabComments = s.activeTab === 'comments';\n      base.tabRevisions = s.activeTab === 'revisions'; base.tabWorkflow = s.activeTab === 'workflow'; base.tabAttachments = s.activeTab === 'attachments';\n      base.tabOverviewOn = base.tabOverview ? 'on' : ''; base.tabCommentsOn = base.tabComments ? 'on' : '';\n      base.tabRevisionsOn = base.tabRevisions ? 'on' : ''; base.tabWorkflowOn = base.tabWorkflow ? 'on' : ''; base.tabAttachmentsOn = base.tabAttachments ? 'on' : '';\n\n      const ov = [\n        { k: 'Type', v: d.type }, { k: 'Discipline', v: d.discipline },\n        { k: 'Revision', v: d.revision }, { k: 'Confidentiality', v: d.confidentiality },\n        { k: 'Originator', v: DMS.nameOf(d.originator) }, { k: 'Originator org', v: d.originator_org || '—' },\n        { k: 'Project', v: d.project_id }, { k: 'Current holder', v: DMS.nameOf(d.current_assignee) },\n        { k: 'Submitted', v: d.submitted_date || '—' }, { k: 'Due date', v: d.due_date || '—' }, { k: 'Closed', v: d.closed_date || '—' },\n      ];\n      if (d.commercial_value) ov.push({ k: 'Commercial value', v: d.commercial_value });\n      base.ovRows = ov;\n      base.hasDistribution = !!d.distribution_list;\n      base.distribution = d.distribution_list ? d.distribution_list.map((x) => DMS.nameOf(x)).join(', ') : '';\n\n      base.comments = d.comments.map((c) => ({ author: DMS.nameOf(c.author), role: c.role, timestamp: c.timestamp, text: c.text }));\n      base.noComments = d.comments.length === 0;\n      base.canComment = !!p.comment; base.commentDraft = s.commentDraft; base.setCommentDraft = this.setCommentDraft; base.postComment = this.postComment;\n\n      base.revisions = d.revision_history.map((r) => ({ revision: r.revision, date: r.date, summary: r.change_summary, by: DMS.nameOf(r.uploaded_by) }));\n\n      base.steps = d.workflow_trail.map((w) => {\n        const done = w.decision && !['Pending', 'Not started'].includes(w.decision);\n        const cls = done ? 'done' : (w.decision === 'Pending' ? 'pend' : '');\n        return { step: w.step, actor: DMS.nameOf(w.actor), decision: w.decision, date: w.date || '', cls };\n      });\n\n      base.attachments = (d.attachments || []).map((a) => ({\n        file: a.file_name, type: (a.type || 'FILE'), meta: `${a.type} · ${a.size} · ${DMS.nameOf(a.uploaded_by)} · ${a.date}`,\n        onDownload: () => this.downloadAttachment(d.doc_number, a.file_name),\n      }));\n      base.noAttachments = !d.attachments || d.attachments.length === 0;\n\n      const acts = [];\n      if (p.approve) {\n        acts.push({ label: 'Code 1 · Approve', variant: 'primary', onClick: () => this.applyCode('1') });\n        acts.push({ label: 'Code 2 · Approve w/ comments', variant: 'secondary', onClick: () => this.applyCode('2') });\n        acts.push({ label: 'Code 3 · Revise & resubmit', variant: 'secondary', onClick: () => this.applyCode('3') });\n        acts.push({ label: 'Code 4 · Reject', variant: 'ghost', onClick: () => this.applyCode('4') });\n      }\n      if (p.upload) acts.push({ label: 'Upload new revision', variant: 'secondary', onClick: () => this.uploadRev() });\n      base.actions = acts;\n      base.actionNote = acts.length ? '' : `Your role (${DMS.session.user.role}) has view${p.comment ? ' and comment' : ''}-only access to this document.`;\n    } else {\n      base.actions = []; base.actionNote = ''; base.ovRows = []; base.comments = []; base.revisions = []; base.steps = []; base.attachments = [];\n      base.tabOverview = true;\n    }\n\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
